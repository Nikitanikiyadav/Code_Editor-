[build]
  command = "npm run build"
  publish = "dist"

# No backend runs on Netlify: make /api calls fail clearly instead of
# returning index.html (which the app would try to parse as data).
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

# React Router uses client-side routes (/login, /dashboard, /room/...).
# Serve index.html for any path that isn't a real file so refreshes don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
